<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <title>Guion Comic</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="cabecera">
    <button id="btn-volver" class="btn-icono" aria-label="Volver" hidden>←</button>
    <h1 id="titulo-vista" class="titulo-vista">Proyectos</h1>
    <button id="btn-accion" class="btn-icono" aria-label="Acción">+</button>
  </header>

  <main class="contenedor">

    <section id="vista-proyectos" class="vista activa">
      <ul class="lista">
        <li class="item" data-vista="paginas">
          <span class="item-titulo">Proyecto de prueba</span>
          <span class="item-sub">3 páginas</span>
        </li>
      </ul>
    </section>

    <section id="vista-paginas" class="vista">
      <ul class="lista">
        <li class="item" data-vista="editor">
          <span class="item-titulo">1 - Portada</span>
          <span class="item-sub">5 viñetas</span>
        </li>
        <li class="item" data-vista="editor">
          <span class="item-titulo">2 - Persecución</span>
          <span class="item-sub">6 viñetas</span>
        </li>
      </ul>
    </section>

    <section id="vista-editor" class="vista">
      <p class="placeholder">Aquí irá el editor de viñetas.</p>
    </section>

    <section id="vista-exportar" class="vista">
      <p class="placeholder">Aquí irá la exportación.</p>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
